[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aspire-inference"
authors = [
    {name = "Michael J. Williams", email = "michaeljw1@googlemail.com"},
]
description = "Accelerate Sequential Posterior Inference via REuse"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib",
    "numpy",
    "array-api-compat",
    "array-api-extra",
    "wrapt",
    "h5py",
    "orng",
]

dynamic = ["version"]

[project.optional-dependencies]
scipy = [
    "scipy",
]
jax = [
    "jax",
    "jaxlib<0.8.2; python_version < '3.12'",
    "jaxlib; python_version >= '3.12'",
    "flowjax",
]
torch = [
    "torch",
    "zuko",
    "tqdm",
]
minipcn = [
    "minipcn[array-api]>=0.2.0a3",
]
emcee = [
    "emcee",
]
blackjax = [
    "blackjax",
    "fastprogress<1.1.0",
]
test = [
    "pytest",
    "pytest-requires",
    "pytest-cov",
]
corner = [
    "corner",
]
pandas = [
    "pandas",
]

[project.urls]
Homepage = "https://github.com/mj-will/aspire"
Documentation = "https://aspire.readthedocs.io/"

[tool.setuptools_scm]

[tool.setuptools.package-dir]
aspire = "src/aspire"

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
extend-select = ["I"]

[tool.pytest.ini_options]
addopts = [
    "--cov=aspire",
    "--cov-report=term-missing",
    "-ra",
    "--import-mode=importlib",
]
testpaths = ["tests"]

# Pixi reuses the package dependencies, optional extras and dependency groups.
[dependency-groups]
test-core = [
    "pytest",
    "pytest-requires",
    "pytest-cov",
    "scipy",
    "corner",
    "pandas",
]
lint = [
    "pre-commit",
    "ruff==0.11.8",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
requires-pixi = ">=0.78"

[tool.pixi.pypi-dependencies]
aspire-inference = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["py313", "test-core", "jax", "torch-cpu", "minipcn", "emcee", "blackjax", "lint"], solve-group = "py313" }
py311 = ["py311", "test-core", "jax", "torch-cpu", "minipcn", "emcee", "blackjax"]
py312 = ["py312", "test-core", "jax", "torch-cpu", "minipcn", "emcee", "blackjax"]
py313 = { features = ["py313", "test-core", "jax", "torch-cpu", "minipcn", "emcee", "blackjax"], solve-group = "py313" }

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.test-core.tasks]
test = "python -m pytest"
test-unit = "python -m pytest tests --ignore=tests/integration_tests"

[tool.pixi.feature.lint.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."

[tool.pixi.feature.jax.activation.env]
JAX_PLATFORMS = "cpu"

[tool.pixi.feature.torch-cpu.dependencies]
pytorch-cpu = "*"
# Match Sequince's CPU setup and avoid MKL activation requiring Intel runtimes.
libblas = { version = "*", build = "*openblas" }

[tool.pixi.feature.torch-cpu.pypi-dependencies]
zuko = "*"
tqdm = "*"
