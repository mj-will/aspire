# Work flow to run (fast) examples and check they work
name: Examples

on:
  push:
    branches: [ main, release* ]
  pull_request:
    branches: [ main, release* ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Pixi py312

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.81.0
        environments: py312
    - name: Run all examples
      run: |
        failed=0

        for example in $(ls examples/*.py | sort); do
          echo "::group::Running ${example}"
          if ! pixi run -e py312 python "${example}"; then
            echo "FAILED: ${example}"
            failed=1
          fi
          echo "::endgroup::"
        done

        if [ "${failed}" -ne 0 ]; then
          echo "One or more examples failed."
          exit 1
        fi
